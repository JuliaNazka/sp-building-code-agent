[project]
name = "coe-agent"
version = "0.1.0"
description = "LangGraph RAG agent that answers questions about the São Paulo Building Code (COE) with article/page citations."
readme = "README.md"
license = "MIT"
authors = [{ name = "Júlia Nazka" }]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4",
    "langchain-core>=1.7",
    "langchain-google-genai>=4.4",
    "langchain-community>=0.4",
    "langgraph>=1.2",
    "rank-bm25>=0.2.2",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
coe-ingest = "coe_agent.ingest:main"
coe-ask = "coe_agent.cli:main"
coe-serve = "coe_agent.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
